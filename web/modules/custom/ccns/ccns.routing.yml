ccns.post:
  path: '/post'
  defaults:
    _title: 'Let`s post some stuff'
    _controller: '\Drupal\ccns\Controller\CcnsController::post'
  requirements:
    _permission: 'access content'

ccns.login_modal:
  path: '/nostr-login'
  defaults:
    _controller: '\Drupal\ccns\Controller\CcnsController::loginModal'
  requirements:
    _permission: 'access content'

ccns.create_user:
  path: '/create-user'
  defaults:
    _controller: '\Drupal\ccns\Controller\CcnsController::createUser'
  methods:
    - POST
  requirements:
    _permission: 'access content'
    _format: json

ccns.global:
  path: '/global'
  defaults:
    _title: 'Global feed with latest ~50 web bookmarks (NIP-B0)'
    _controller: '\Drupal\ccns\Controller\CcnsController::globalFeed'
  requirements:
    _permission: 'access content'
